<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round 1 Results - Cyber Tech Sprint</title>
    <link rel="stylesheet" href="../../../CSS/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        .results-content {
            padding: 2rem;
            margin-top: 5rem;
            text-align: center;
        }

        .timer-container {
            background: rgba(19, 21, 29, 0.8);
            border: 1px solid #00ffff40;
            border-radius: 1rem;
            padding: 2rem;
            margin: 2rem auto;
            max-width: 600px;
        }

        .timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin: 2rem 0;
        }

        .timer-block {
            background: rgba(0, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .timer-value {
            font-size: 2.5rem;
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .timer-label {
            color: #ffffff90;
            font-size: 0.9rem;
        }

        .results-table {
            background: rgba(19, 21, 29, 0.8);
            border: 1px solid #00ffff40;
            border-radius: 1rem;
            padding: 2rem;
            margin: 2rem auto;
            max-width: 800px;
            display: none;
        }

        .results-table.visible {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            color: #fff;
        }

        th {
            color: #00ffff;
            font-weight: 600;
        }

        tr:hover {
            background: rgba(0, 255, 255, 0.1);
        }

        .section-title {
            color: #00ffff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .section-subtitle {
            color: #ffffff90;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .timer {
                grid-template-columns: repeat(2, 1fr);
            }

            .timer-value {
                font-size: 2rem;
            }

            .section-title {
                font-size: 2rem;
            }

            .section-subtitle {
                font-size: 1rem;
            }

            th, td {
                padding: 0.8rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .results-content {
                padding: 1rem;
            }

            .timer-container, .results-table {
                padding: 1rem;
            }

            .timer-value {
                font-size: 1.5rem;
            }

            th, td {
                padding: 0.6rem;
                font-size: 0.8rem;
            }
        }

        /* Add these styles for hamburger menu */
        .menu-btn {
            display: none;
            color: #00ffff;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .menu-btn {
                display: block;
            }

            .navbar {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 300px;
                height: 100vh;
                background: rgba(19, 21, 29, 0.95);
                backdrop-filter: blur(10px);
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2rem;
                transition: 0.3s ease;
                border-left: 1px solid rgba(0, 255, 255, 0.1);
                z-index: 95;
            }

            .navbar.active {
                right: 0;
            }

            .menu-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(3px);
                z-index: 90;
            }

            .menu-overlay.active {
                display: block;
            }
        }
    </style>
</head>
<body>

    <script src="../../../JAVASCRIPT/matrix.js"></script>

    <script>
        // Only keep the menu functionality
        const menuBtn = document.querySelector('.menu-btn');
        const navbar = document.querySelector('.navbar');
        const overlay = document.querySelector('.menu-overlay');
        const menuIcon = menuBtn.querySelector('i');

        menuBtn.addEventListener('click', () => {
            navbar.classList.toggle('active');
            overlay.classList.toggle('active');
            
            if (navbar.classList.contains('active')) {
                menuIcon.classList.remove('bx-menu');
                menuIcon.classList.add('bx-x');
            } else {
                menuIcon.classList.remove('bx-x');
                menuIcon.classList.add('bx-menu');
            }
        });

        overlay.addEventListener('click', () => {
            navbar.classList.remove('active');
            overlay.classList.remove('active');
            menuIcon.classList.remove('bx-x');
            menuIcon.classList.add('bx-menu');
        });
    </script>
</body>
</html>
