<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round 1 Results - Cyber Tech Sprint</title>
    <link rel="stylesheet" href="../../../CSS/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        .results-content {
            padding: 2rem;
            margin-top: 5rem;
            text-align: center;
        }

        .timer-container {
            background: rgba(19, 21, 29, 0.8);
            border: 1px solid #00ffff40;
            border-radius: 1rem;
            padding: 2rem;
            margin: 2rem auto;
            max-width: 600px;
        }

        .timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin: 2rem 0;
        }

        .timer-block {
            background: rgba(0, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .timer-value {
            font-size: 2.5rem;
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .timer-label {
            color: #ffffff90;
            font-size: 0.9rem;
        }

        .results-table {
            background: rgba(19, 21, 29, 0.8);
            border: 1px solid #00ffff40;
            border-radius: 1rem;
            padding: 2rem;
            margin: 2rem auto;
            max-width: 800px;
            display: none;
        }

        .results-table.visible {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            color: #fff;
        }

        th {
            color: #00ffff;
            font-weight: 600;
        }

        tr:hover {
            background: rgba(0, 255, 255, 0.1);
        }

        .section-title {
            color: #00ffff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .section-subtitle {
            color: #ffffff90;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .timer {
                grid-template-columns: repeat(2, 1fr);
            }

            .timer-value {
                font-size: 2rem;
            }

            .section-title {
                font-size: 2rem;
            }

            .section-subtitle {
                font-size: 1rem;
            }

            th, td {
                padding: 0.8rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .results-content {
                padding: 1rem;
            }

            .timer-container, .results-table {
                padding: 1rem;
            }

            .timer-value {
                font-size: 1.5rem;
            }

            th, td {
                padding: 0.6rem;
                font-size: 0.8rem;
            }
        }

        /* Add these styles for hamburger menu */
        .menu-btn {
            display: none;
            color: #00ffff;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .menu-btn {
                display: block;
            }

            .navbar {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 300px;
                height: 100vh;
                background: rgba(19, 21, 29, 0.95);
                backdrop-filter: blur(10px);
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2rem;
                transition: 0.3s ease;
                border-left: 1px solid rgba(0, 255, 255, 0.1);
                z-index: 95;
            }

            .navbar.active {
                right: 0;
            }

            .menu-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(3px);
                z-index: 90;
            }

            .menu-overlay.active {
                display: block;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <script src="../../../JAVASCRIPT/matrix.js"></script>

    <header class="header">
        <a href="/" class="logo">{Cybernerds KARE}</a>
        <div class="menu-btn">
            <i class='bx bx-menu'></i>
        </div>
        <nav class="navbar">
            <a href="/" style="--i: 1">Home</a>
            <a href="/cts" style="--i: 2">CTF Event</a>
        </nav>
    </header>

    <div class="menu-overlay"></div>

    <section class="results-content">
        <h1 class="section-title">Round 1 Results</h1>
        <p class="section-subtitle">Results will be revealed at 11:00 AM IST</p>

        <div class="timer-container">
            <div class="timer">
                <div class="timer-block">
                    <div class="timer-value" id="days">00</div>
                    <div class="timer-label">Days</div>
                </div>
                <div class="timer-block">
                    <div class="timer-value" id="hours">00</div>
                    <div class="timer-label">Hours</div>
                </div>
                <div class="timer-block">
                    <div class="timer-value" id="minutes">00</div>
                    <div class="timer-label">Minutes</div>
                </div>
                <div class="timer-block">
                    <div class="timer-value" id="seconds">00</div>
                    <div class="timer-label">Seconds</div>
                </div>
            </div>
        </div>

        <div class="results-table" id="resultsTable">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Username</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <!-- Results will be populated here -->
                </tbody>
            </table>
        </div>
    </section>

    <script>
        let remainingTimeFromServer = null;
        let startTime = null;
        let showingResults = false;

        // Timer and Results functionality
        async function updateTimerAndResults() {
            // Fetch from server only if:
            // 1. First time (remainingTimeFromServer is null)
            // 2. Timer has reached zero and results aren't showing
            if (remainingTimeFromServer === null || 
                (remainingTimeFromServer <= 0 && !showingResults)) {
                
                try {
                    const response = await fetch('https://cybernerds.vercel.app/api/results-status');
                    const data = await response.json();

                    if (!data.success) throw new Error(data.error);

                    if (data.showResults && !showingResults) {
                        // Show results
                        document.querySelector('.timer-container').style.display = 'none';
                        document.querySelector('.section-subtitle').textContent = 'Round 1 Results';
                        
                        const resultsTable = document.getElementById('resultsTable');
                        const resultsBody = document.getElementById('resultsBody');
                        resultsBody.innerHTML = '';

                        data.results.forEach(result => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${result.rank}</td>
                                <td>${result.user}</td>
                                <td>${result.score}</td>
                            `;
                            resultsBody.appendChild(row);
                        });

                        resultsTable.classList.add('visible');
                        showingResults = true;
                        return; // Stop updating timer once results are shown
                    }

                    // Store initial values
                    remainingTimeFromServer = data.remainingTime;
                    startTime = Date.now();
                } catch (error) {
                    console.error('Error updating timer:', error);
                    return;
                }
            }

            // Update timer display
            if (!showingResults && remainingTimeFromServer !== null) {
                // Calculate current remaining time
                const elapsedTime = Date.now() - startTime;
                const currentRemaining = remainingTimeFromServer - elapsedTime;

                if (currentRemaining <= 0) {
                    // Timer reached zero, fetch results
                    remainingTimeFromServer = 0;
                    updateTimerAndResults();
                    return;
                }

                const days = Math.floor(currentRemaining / (1000 * 60 * 60 * 24));
                const hours = Math.floor((currentRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((currentRemaining % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((currentRemaining % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = String(days).padStart(2, '0');
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            }
        }

        // Update timer immediately and then every second
        updateTimerAndResults();
        setInterval(updateTimerAndResults, 1000);

        // Menu functionality
        const menuBtn = document.querySelector('.menu-btn');
        const navbar = document.querySelector('.navbar');
        const overlay = document.querySelector('.menu-overlay');
        const menuIcon = menuBtn.querySelector('i');

        menuBtn.addEventListener('click', () => {
            navbar.classList.toggle('active');
            overlay.classList.toggle('active');
            
            if (navbar.classList.contains('active')) {
                menuIcon.classList.remove('bx-menu');
                menuIcon.classList.add('bx-x');
            } else {
                menuIcon.classList.remove('bx-x');
                menuIcon.classList.add('bx-menu');
            }
        });

        overlay.addEventListener('click', () => {
            navbar.classList.remove('active');
            overlay.classList.remove('active');
            menuIcon.classList.remove('bx-x');
            menuIcon.classList.add('bx-menu');
        });
    </script>
</body>
</html>
