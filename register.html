<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Sleuth Registration - Cybernerds KARE</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/register.css">
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <script src="JAVASCRIPT/matrix.js"></script>

    <header class="header">
        <a href="#" class="logo">{Cybernerds KARE}</a>
        <nav class="navbar">
            <a href="/" style="--i: 1">Home</a>
            <a href="/vintra" style="--i: 2">Back to Event</a>
        </nav>
    </header>

    <section class="registration">
        <div class="registration-content">
            <h2>Cyber Sleuth Registration</h2>
            <form id="registrationForm">
                <!-- Team Leader -->
                <div class="team-section">
                    <h3>Team Leader</h3>
                    <div class="form-group">
                        <input type="text" id="leaderName" name="leaderName" required>
                        <label>Full Name</label>
                    </div>
                    <div class="form-group">
                        <input type="text" id="leaderRegNo" name="leaderRegNo" required>
                        <label>Registration Number</label>
                    </div>
                    <div class="form-group">
                        <select id="leaderDepartment" name="leaderDepartment" required>
                            <option value="">Select Department</option>
                            <option value="CSE">CSE</option>
                            <option value="IT">IT</option>
                            <option value="CS/IT">CS/IT</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <select id="leaderYear" name="leaderYear" required>
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="tel" id="leaderPhone" name="leaderPhone" pattern="[0-9]{10}" required>
                        <label>Phone Number</label>
                    </div>
                </div>

                <!-- Team Members -->
<!-- Inside the form, after the team leader section -->
                <div class="team-members-container">
                    <h3>Team Members</h3>
                    <div class="team-section" id="teamMembers">
                        <!-- Team members will be dynamically added here -->
                    </div>
                </div>

                <button type="submit" class="submit-btn">Register Team</button>
            </form>
        </div>
    </section>

    <script src="JAVASCRIPT/register.js"></script>
</body>
</html>
