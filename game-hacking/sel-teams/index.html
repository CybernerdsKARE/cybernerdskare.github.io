    <style>
        .content-section {
            padding: 2rem;
            margin-top: 5rem;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title {
            color: #00ffff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .section-subtitle {
            color: #ffffff90;
            font-size: 1.2rem;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 2rem;
            border: 1px solid rgba(0, 255, 255, 0.3);
            background: rgba(19, 21, 29, 0.8);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .search-icon {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: #00ffff;
            font-size: 1.2rem;
        }

        .teams-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .team-card {
            background: rgba(19, 21, 29, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .team-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.2);
        }

        .team-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .team-number {
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            font-size: 1.5rem;
            font-weight: bold;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .team-title {
            color: #00ffff;
            font-size: 1.1rem;
            font-weight: 600;
            flex: 1;
        }

        .team-members {
            list-style: none;
            padding: 0;
        }

        .team-member {
            display: flex;
            margin-bottom: 0.8rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .team-member:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .member-reg {
            color: #ffffff80;
            font-size: 0.9rem;
            width: 120px;
            margin-right: 1rem;
        }

        .member-name {
            color: #fff;
            font-size: 0.95rem;
            flex: 1;
        }

        .no-results {
            text-align: center;
            color: #ffffff90;
            font-size: 1.2rem;
            grid-column: 1 / -1;
            padding: 2rem;
        }

        /* Hamburger menu styles */
        .menu-btn {
            display: none;
            color: #00ffff;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 100;
        }

        /* Mobile navbar styles */
        @media (max-width: 768px) {
            .menu-btn {
                display: block;
            }

            .navbar {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 300px;
                height: 100vh;
                background: rgba(19, 21, 29, 0.95);
                backdrop-filter: blur(10px);
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2rem;
                transition: 0.3s ease;
                border-left: 1px solid rgba(0, 255, 255, 0.1);
                z-index: 95;
            }

            .navbar.active {
                right: 0;
            }

            .navbar a {
                font-size: 1.2rem;
                padding: 0.8rem 2rem;
                width: 80%;
                text-align: center;
                border: 1px solid rgba(0, 255, 255, 0.1);
                border-radius: 0.5rem;
            }

            .navbar a:hover {
                background: rgba(0, 255, 255, 0.1);
            }

            /* Overlay when menu is open */
            .menu-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(3px);
                z-index: 90;
            }

            .menu-overlay.active {
                display: block;
            }
        }

        /* Base mobile styles - for portrait phones */
        @media (max-width: 576px) {
            .content-section {
                padding: 1rem;
                margin-top: 4rem;
            }

            .section-title {
                font-size: 1.8rem;
            }

            .section-subtitle {
                font-size: 0.9rem;
            }

            .teams-container {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .team-card {
                padding: 1rem;
            }

            .team-number {
                width: 2.5rem;
                height: 2.5rem;
                font-size: 1.2rem;
            }

            .team-title {
                font-size: 0.95rem;
            }

            .member-reg {
                width: 100px;
                font-size: 0.8rem;
            }

            .member-name {
                font-size: 0.85rem;
            }
        }

        /* Landscape phones */
        @media (min-width: 576px) and (max-width: 767px) {
            .teams-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        /* Tablets */
        @media (min-width: 768px) and (max-width: 991px) {
            .teams-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
        }

        /* Hover effects only for devices that support hover */
        @media (hover: hover) {
            .team-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 4px 20px rgba(0, 255, 255, 0.2);
            }
        }

        /* Reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            .team-card {
                transition: none;
            }
        }

        /* Print styles */
        @media print {
            .teams-container {
                display: block;
            }

            .team-card {
                break-inside: avoid;
                margin-bottom: 1rem;
            }

            .header, .menu-btn, .menu-overlay, .search-container {
                display: none;
            }
        }

        /* Canvas for confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
    </style>

        // Function to render teams
        function renderTeams(teams) {
            const container = document.getElementById('teamsContainer');
            container.innerHTML = '';

            if (teams.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'no-results';
                noResults.textContent = 'No teams found matching your search.';
                container.appendChild(noResults);
                return;
            }

            teams.forEach(team => {
                const teamCard = document.createElement('div');
                teamCard.className = 'team-card';

                const teamHeader = document.createElement('div');
                teamHeader.className = 'team-header';

                const teamNumber = document.createElement('div');
                teamNumber.className = 'team-number';
                teamNumber.textContent = team.teamNo;

                const teamTitle = document.createElement('div');
                teamTitle.className = 'team-title';
                teamTitle.textContent = team.projectTitle;

                teamHeader.appendChild(teamNumber);
                teamHeader.appendChild(teamTitle);
                teamCard.appendChild(teamHeader);

                const membersList = document.createElement('ul');
                membersList.className = 'team-members';

                team.members.forEach(member => {
                    const memberItem = document.createElement('li');
                    memberItem.className = 'team-member';

                    const memberReg = document.createElement('div');
                    memberReg.className = 'member-reg';
                    memberReg.textContent = member.regNo;

                    const memberName = document.createElement('div');
                    memberName.className = 'member-name';
                    memberName.textContent = member.name;

                    memberItem.appendChild(memberReg);
                    memberItem.appendChild(memberName);
                    membersList.appendChild(memberItem);
                });

                teamCard.appendChild(membersList);
                container.appendChild(teamCard);
            });
        }

        // Search functionality
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('input', () => {
                const searchTerm = searchInput.value.toLowerCase().trim();
                
                if (searchTerm === '') {
                    renderTeams(teamsData);
                    return;
                }
                
                const filteredTeams = teamsData.filter(team => {
                    // Search by team number
                    if (team.teamNo.toString().includes(searchTerm)) {
                        return true;
                    }
                    
                    // Search by project title
                    if (team.projectTitle.toLowerCase().includes(searchTerm)) {
                        return true;
                    }
                    
                    // Search by member name or reg number
                    return team.members.some(member => 
                        member.name.toLowerCase().includes(searchTerm) || 
                        member.regNo.toLowerCase().includes(searchTerm)
                    );
                });
                
                renderTeams(filteredTeams);
            });
        }

        // Mobile menu functionality
        function setupMobileMenu() {
            const menuBtn = document.querySelector('.menu-btn');
            const navbar = document.querySelector('.navbar');
            const overlay = document.querySelector('.menu-overlay');
            const menuIcon = menuBtn.querySelector('i');

            menuBtn.addEventListener('click', () => {
                navbar.classList.toggle('active');
                overlay.classList.toggle('active');
                
                // Toggle menu icon
                if (navbar.classList.contains('active')) {
                    menuIcon.classList.remove('bx-menu');
                    menuIcon.classList.add('bx-x');
                } else {
                    menuIcon.classList.remove('bx-x');
                    menuIcon.classList.add('bx-menu');
                }
            });

            // Close menu when clicking overlay
            overlay.addEventListener('click', () => {
                navbar.classList.remove('active');
                overlay.classList.remove('active');
                menuIcon.classList.remove('bx-x');
                menuIcon.classList.add('bx-menu');
            });

            // Close menu when clicking a link
            document.querySelectorAll('.navbar a').forEach(link => {
                link.addEventListener('click', () => {
                    navbar.classList.remove('active');
                    overlay.classList.remove('active');
                    menuIcon.classList.remove('bx-x');
                    menuIcon.classList.add('bx-menu');
                });
            });
        }

        // Initialize everything when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            renderTeams(teamsData);
            setupSearch();
            setupMobileMenu();
        });
