<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Teams - Game Hacking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .team-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .team-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,255,0,0.2);
        }
        .problem-statement {
            color: #00ff00;
            font-size: 0.9em;
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(0,255,0,0.1);
            border-radius: 4px;
        }
        .team-members {
            color: #cccccc;
            font-size: 0.9em;
            margin: 15px 0;
        }
        .page-title {
            color: #00ff00;
            text-align: center;
            margin: 40px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .loading {
            text-align: center;
            color: #00ff00;
            margin: 50px 0;
        }
        .member-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }
        .member-info:last-child {
            border-bottom: none;
        }
        .reg-no {
            color: #888;
            font-size: 0.8em;
        }
        .team-name {
            color: #00ff00;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">Registered Teams</h1>
        <div id="teamsContainer" class="row">
            <div class="loading">Loading teams...</div>
        </div>
    </div>

    <script>
        async function fetchTeams() {
            try {
                const response = await fetch('https://cybernerds.vercel.app/api/teams');
                const data = await response.json();
                
                if (data.success) {
                    displayTeams(data.data);
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                console.error('Error fetching teams:', error);
                document.getElementById('teamsContainer').innerHTML = `
                    <div class="col-12 text-center">
                        <p class="text-danger">Error loading teams. Please try again later.</p>
                    </div>
                `;
            }
        }

        function displayTeams(teams) {
            const container = document.getElementById('teamsContainer');
            
            if (!teams || teams.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center">
                        <p>No teams registered yet.</p>
                    </div>
                `;
                return;
            }

            const teamsHTML = teams.map(team => `
                <div class="col-md-6 col-lg-4">
                    <div class="team-card">
                        <h3 class="team-name">${team.teamName}</h3>
                        
                        <div class="team-members">
                            <h5>Team Lead</h5>
                            <div class="member-info">
                                <span>${team.teamLead.name}</span>
                                <span class="reg-no">${team.teamLead.regNo}</span>
                            </div>
                            
                            <h5 class="mt-3">Team Members</h5>
                            ${team.members.map(member => `
                                <div class="member-info">
                                    <span>${member.name}</span>
                                    <span class="reg-no">${member.regNo}</span>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div class="problem-statement">
                            <strong>Problem Statement:</strong><br>
                            ${team.problemStatement}
                        </div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = teamsHTML;
        }

        // Fetch teams when page loads
        document.addEventListener('DOMContentLoaded', fetchTeams);
    </script>
</body>
</html>
