<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Statements - Cybernerds KARE</title>
    <link rel="stylesheet" href="../../CSS/style.css">
    <link rel="stylesheet" href="../../CSS/game-hacking.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        .problem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }

        .problem-card {
            background: rgba(19, 21, 29, 0.8);
            border: 1px solid #00ffff40;
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .problem-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.2);
        }

        .problem-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .icon-circle {
            /* First create a perfect square */
            aspect-ratio: 1;
            width: 8rem;
            /* height will automatically be 3.5rem due to aspect-ratio */
            
            /* Make it circular */
            border-radius: 50%;
            
            /* Other styles */
            background: rgba(0, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1.5rem;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .icon-circle i {
            color: #00ffff;
            font-size: 1.8rem;
        }

        .problem-title {
            color: #00ffff;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .problem-description {
            color: #ffffff90;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .problem-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 1rem;
        }

        .teams-count {
            color: #ffffff70;
            font-size: 0.9rem;
        }

        .content-section {
            padding: 2rem;
            margin-top: 5rem;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title {
            color: #00ffff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .section-subtitle {
            color: #ffffff90;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <script src="../../JAVASCRIPT/matrix.js"></script>

    <header class="header">
        <a href="#" class="logo">{Cybernerds KARE}</a>
        <nav class="navbar">
            <a href="/" style="--i: 1">Home</a>
            <a href="/game-hacking/problem-statements" style="--i: 2">Problem Statements</a>
            <a href="/game-hacking/register" style="--i: 3">Register Now</a>
        </nav>
    </header>

    <section class="content-section">
        <div class="section-header">
            <h1 class="section-title">Problem Statements</h1>
            <p class="section-subtitle">Choose from our curated list of cybersecurity challenges</p>
        </div>

        <div id="problemList" class="problem-grid">
            <!-- Problems will be populated here -->
        </div>
    </section>

    <script>
        const icons = {
            "AI-Powered Phishing Detection System": "bx bx-shield-quarter",
            "Password-less Secure Authentication System": "bx bx-key",
            "Fake News Detection Tool": "bx bx-news",
            "Cybersecurity Awareness Chatbot": "bx bx-bot",
            "Credit Card Fraud Detection System": "bx bx-credit-card",
            "Cybercrime Reporting & Analysis System": "bx bx-chart",
            "Ransomware Detection & Prevention System": "bx bx-lock",
            "Deepfake Detection System": "bx bx-video",
            "Online Fraud Detection System": "bx bx-error",
            "Secure Password Manager": "bx bx-lock-alt",
            "Data Encryption Tool": "bx bx-data",
            "Secure File Sharing Platform": "bx bx-share-alt",
            "Online Payment Fraud Detection": "bx bx-money",
            "Antivirus Software with Real-Time Protection": "bx bx-shield",
            "Educational Keylogger System": "bx bx-mouse"
        };

        async function fetchProblems() {
            try {
                const response = await fetch('http://localhost:3000/api/problems');
                const data = await response.json();
                
                if (data.success) {
                    const problemList = document.getElementById('problemList');
                    data.data.forEach(problem => {
                        const card = createProblemCard(problem);
                        problemList.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Error fetching problems:', error);
            }
        }

        function createProblemCard(problem) {
            const div = document.createElement('div');
            div.className = 'problem-card';
            
            const icon = icons[problem.title] || 'bx bx-code';
            
            div.innerHTML = `
                <div class="problem-header">
                    <div class="icon-circle">
                        <i class="${icon}"></i>
                    </div>
                    <h3 class="problem-title">${problem.title}</h3>
                </div>
                <p class="problem-description">${problem.description}</p>
                <div class="problem-footer">
                    <span class="teams-count">Teams assigned: ${problem.teams_assigned || 0}/3</span>
                </div>
            `;
            
            return div;
        }

        // Load problems when the page loads
        document.addEventListener('DOMContentLoaded', fetchProblems);
    </script>
</body>
</html>
